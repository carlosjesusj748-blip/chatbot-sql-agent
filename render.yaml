services:
  - type: web
    name: chatbot-sql-agent
    runtime: python
    buildCommand: pip install -r requirements.txt && python setup_database.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
